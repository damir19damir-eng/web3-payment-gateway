server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:certs/gateway.p12
    key-store-password: changeit
    key-store-type: PKCS12
    client-auth: none   # Вместо need
    trust-store: file:certs/ca.p12
    trust-store-password: changeit
    trust-store-type: PKCS12
    enabled-protocols: TLSv1.3

spring:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
  r2dbc:
    url: r2dbc:pool:postgresql://localhost:5432/pay
    username: pay
    password: pay

gateway:
  shards:
    - url: r2dbc:pool:postgresql://localhost:5432/pay
      username: pay
      password: pay
    - url: r2dbc:pool:postgresql://localhost:5433/pay
      username: pay
      password: pay
  clients:
    acme: "REPLACE_WITH_CLIENT_PUBLIC_KEY"
  vault:
    addr: ${VAULT_ADDR:}
    token: ${VAULT_TOKEN:}
    key-name: gateway-signing
  crypto:
    session-ttl-seconds: 900
    max-messages-per-session: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

