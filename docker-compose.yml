# Локальная инфраструктура для разработки. В проде каждый компонент — отказоустойчивый кластер в нескольких ЦОД.
services:
  pg-shard0:
    image: postgres:16
    environment: { POSTGRES_USER: pay, POSTGRES_PASSWORD: pay, POSTGRES_DB: pay }
    ports: ["5432:5432"]
    volumes: ["./db:/docker-entrypoint-initdb.d:ro"]
  pg-shard1:
    image: postgres:16
    environment: { POSTGRES_USER: pay, POSTGRES_PASSWORD: pay, POSTGRES_DB: pay }
    ports: ["5433:5432"]
    volumes: ["./db:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
  vault:
    image: hashicorp/vault:1.17
    command: ["server", "-dev", "-dev-root-token-id=dev-root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]
